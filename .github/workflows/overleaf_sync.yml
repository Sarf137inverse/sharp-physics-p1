name: Manual Overleaf Sync

on:
  workflow_dispatch: # This enables the manual click button in GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Overleaf Sync Action
        uses: subhamX/overleaf_sync_with_git@v1.2.0
        with:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
          OVERLEAF_COOKIE: ${{ secrets.OVERLEAF_COOKIE }}
