name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sharp-physics-builder .

      - name: Compile PDF
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/src:/workspace" \
            sharp-physics-builder \
            bash build.sh
            
      - name: Show log on failure
        if: failure()
        run: cat src/build/main.log

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: src/build/main.pdf
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sharp-physics-builder .

      - name: Compile PDF
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/src:/workspace" \
            sharp-physics-builder \
            bash build.sh

      - name: Upload to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: src/build/main.pdf
          make_latest: true